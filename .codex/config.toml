[agents.security_guardian]
description = "Audits changes against PJ's privacy, approval, upload, secret, and logging invariants."
config_file = "agents/security-guardian.toml"

[agents.responses_engineer]
description = "Designs and reviews Responses API orchestration through PJ's provider interface."
