[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"generated_skills/*.py" = ["E401", "E402"]
"ops/chief/service.py" = ["E702", "E731", "F401"]
"ops/docs/service.py" = ["F401"]
"pj.py" = ["F401"]
"skills.py" = ["E402", "F401"]
"tests/test_smoke.py" = ["E401"]
"voice.py" = ["F811"]

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
files = [
  "pj_contract.py",
  "realtime_config.py",
  "runtime_config.py",
  "ops/shared/errors.py",
  "ops/shared/interfaces.py",
  "ops/shared/retry.py",
  "ops/shared/validation.py",
]
follow_untyped_imports = true
ignore_missing_imports = true
python_version = "3.11"
warn_unused_configs = true
