<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">PJ governed personal intelligence layer</title>
  <desc id="desc">A layered product diagram showing user inputs flowing through a unified workspace, an intelligence engine, a trust control plane, and local-first foundations to produce verified outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11113a"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16d9e3"/><stop offset="1" stop-color="#7967ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#63e6e2"/></marker>
    <style>
      .label{font:700 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#65e7e1}.heading{font:700 25px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.body{font:500 15px ui-sans-serif,system-ui,sans-serif;fill:#c6d2e3}.small{font:500 13px ui-sans-serif,system-ui,sans-serif;fill:#9fb0c7}.metric{font:700 21px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.card{fill:#111f35;stroke:#29415f;stroke-width:1}.pill{fill:#172a43;stroke:#36506f}.line{stroke:#63e6e2;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="960" rx="28" fill="url(#bg)"/>
  <circle cx="1300" cy="90" r="220" fill="#6559ff" opacity=".08"/><circle cx="80" cy="850" r="260" fill="#16d9e3" opacity=".06"/>
  <text x="70" y="72" class="label">PJ PRODUCT VISION</text><text x="70" y="112" class="heading" font-size="34">One intention → one governed, verified outcome</text>
  <text x="70" y="142" class="body">A private intelligence layer that plans, creates, acts, remembers, and proves its work.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="230" height="530" rx="22" class="card"/>
    <text x="96" y="225" class="label">OWNER INTENT</text>
    <g><rect x="94" y="250" width="182" height="70" rx="14" class="pill"/><text x="118" y="280" class="heading" font-size="18">Speak</text><text x="118" y="302" class="small">Fast, interruptible voice</text></g>
    <g><rect x="94" y="336" width="182" height="70" rx="14" class="pill"/><text x="118" y="366" class="heading" font-size="18">Write</text><text x="118" y="388" class="small">Text and structured goals</text></g>
    <g><rect x="94" y="422" width="182" height="70" rx="14" class="pill"/><text x="118" y="452" class="heading" font-size="18">Show</text><text x="118" y="474" class="small">Files, images, context</text></g>
    <g><rect x="94" y="508" width="182" height="70" rx="14" class="pill"/><text x="118" y="538" class="heading" font-size="18">Delegate</text><text x="118" y="560" class="small">Outcomes, not prompts</text></g>
    <text x="96" y="622" class="small">Any device • one identity</text><text x="96" y="646" class="small">Continuous context</text><text x="96" y="670" class="small">Owner-controlled memory</text>
  </g>

  <path d="M300 455h62" class="line"/>
  <g filter="url(#shadow)">
    <rect x="365" y="190" width="710" height="530" rx="22" class="card"/>
    <text x="395" y="225" class="label">UNIFIED WORKSPACE</text>
    <text x="395" y="260" class="heading">Plan visibly. Execute durably. Explain completely.</text>
    <g><rect x="395" y="292" width="200" height="150" rx="16" fill="#102b3d" stroke="#24647a"/><text x="417" y="325" class="label">UNDERSTAND</text><text x="417" y="358" class="heading" font-size="19">Context graph</text><text x="417" y="386" class="small">Goals • people • projects</text><text x="417" y="410" class="small">Sources • decisions • memory</text></g>
    <g><rect x="620" y="292" width="200" height="150" rx="16" fill="#202044" stroke="#5750a0"/><text x="642" y="325" class="label" fill="#a99fff">REASON</text><text x="642" y="358" class="heading" font-size="19">Outcome engine</text><text x="642" y="386" class="small">Plan • route • checkpoint</text><text x="642" y="410" class="small">Evaluate • recover • learn</text></g>
    <g><rect x="845" y="292" width="200" height="150" rx="16" fill="#17342e" stroke="#347864"/><text x="867" y="325" class="label" fill="#70e6b5">DELIVER</text><text x="867" y="358" class="heading" font-size="19">Artifact canvas</text><text x="867" y="386" class="small">Create • compare • validate</text><text x="867" y="410" class="small">Version • export • restore</text></g>
    <path d="M595 367h22M820 367h22" class="line"/>
    <rect x="395" y="470" width="650" height="95" rx="16" fill="url(#core)" opacity=".18" stroke="#71e8e2"/>
    <text x="417" y="505" class="label">GOVERNED ACTION FABRIC</text>
    <text x="417" y="536" class="body">Preview → policy → approval → idempotent execution → receipt → undo</text>
    <g><rect x="395" y="590" width="650" height="88" rx="16" fill="#0c1728" stroke="#33445d"/><text x="417" y="622" class="label">LOCAL-FIRST FOUNDATION</text><text x="417" y="650" class="small">Responses + Realtime • local tools • MCP • SQLite • artifacts • edge identity</text></g>
  </g>

  <path d="M1075 455h62" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1140" y="190" width="230" height="530" rx="22" class="card"/>
    <text x="1166" y="225" class="label">VERIFIED OUTCOME</text>
    <circle cx="1255" cy="310" r="54" fill="url(#core)"/><path d="M1228 310l18 18 38-42" stroke="white" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1166" y="405" class="heading" font-size="18">Result + evidence</text><text x="1166" y="432" class="small">What changed and why</text>
    <text x="1166" y="478" class="heading" font-size="18">Cost + elapsed time</text><text x="1166" y="505" class="small">No invisible spending</text>
    <text x="1166" y="551" class="heading" font-size="18">Uncertainty + next step</text><text x="1166" y="578" class="small">Partial is an honest state</text>
    <text x="1166" y="624" class="heading" font-size="18">Undo + provenance</text><text x="1166" y="651" class="small">Control remains with owner</text>
  </g>

  <text x="70" y="780" class="label">MEASURABLE NORTH STAR</text><text x="70" y="820" class="heading">Verified outcomes per owner hour</text>
  <g><rect x="70" y="850" width="240" height="68" rx="14" class="pill"/><text x="90" y="879" class="metric">≥ 3×</text><text x="90" y="902" class="small">owner leverage target</text></g>
  <g><rect x="330" y="850" width="240" height="68" rx="14" class="pill"/><text x="350" y="879" class="metric">≥ 85%</text><text x="350" y="902" class="small">one-pass completion</text></g>
  <g><rect x="590" y="850" width="240" height="68" rx="14" class="pill"/><text x="610" y="879" class="metric">0 duplicates</text><text x="610" y="902" class="small">under fault injection</text></g>
  <g><rect x="850" y="850" width="240" height="68" rx="14" class="pill"/><text x="870" y="879" class="metric">≥ 95%</text><text x="870" y="902" class="small">citation entailment</text></g>
  <g><rect x="1110" y="850" width="260" height="68" rx="14" class="pill"/><text x="1130" y="879" class="metric">100%</text><text x="1130" y="902" class="small">sensitive actions gated</text></g>
</svg>
