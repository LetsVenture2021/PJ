            prompt_perfecting_version: perfected.version,
            refined_prompt: perfected.refined_prompt.slice(0, 4000),
            refined_prompt_truncated: perfected.refined_prompt.length > 4000,
            refined_sha256: perfected.refined_sha256,
            changed: perfected.changed,
          };
          await persistRealtimeMessage({
            externalId,
            role: "user",
            content: transcript,
            source: "input_audio",
            metadata,
          });
          if (!state.dataChannel || state.dataChannel.readyState !== "open") {
            throw new Error("Realtime channel closed before transcript replacement.");
          }
          sendRealtimeEvent({
            type: "conversation.item.delete",
            item_id: externalId,
          });
          sendRealtimeEvent({
            type: "conversation.item.create",
            item: {
              type: "message",
              role: "user",
              content: [{
                type: "input_text",
                text: perfected.refined_prompt,
              }],
            },
          });
          sendRealtimeEvent({ type: "response.create" });
          setStatus("Live", "live");
          return;
        }
        await persistRealtimeMessage({
          externalId,
          role: "user",
          content: transcript,
          source: "input_audio",
        });
      } catch (error) {
        state.perfectedInputItems.delete(externalId);
        appendBubble(
          "system",
          `Transcript was preserved but PJ did not respond: ${shorten(String(error), 280)}`,
        );
        setStatus("Live", "live");
      }
    }

    function persistAssistantRealtimeItem(item, status, playbackMs = null) {
      if (!item || !item.text) return;
      const signature = JSON.stringify([
        status,
        playbackMs,
        item.responseId || null,
        item.text,
      ]);
      if (state.persistedRealtimeStates.get(item.externalId) === signature) return;
      state.persistedRealtimeStates.set(item.externalId, signature);
      persistRealtimeMessage({
        externalId: item.externalId,
        role: "assistant",
        content: item.text,
        source: item.source || "output_audio",
        responseId: item.responseId,
        status,
        playbackMs,
      }).catch((error) => {
        if (state.persistedRealtimeStates.get(item.externalId) === signature) {
          state.persistedRealtimeStates.delete(item.externalId);
        }
        appendBubble(
          "system",
          `Transcript persistence failed: ${shorten(String(error), 220)}`,
        );
      });
    }

    function handleRealtimeEvent(event, apiBase) {
      const validationIssue = validateInboundRealtimeEvent(event);
      if (validationIssue) {
        appendBubble("system", `Invalid inbound realtime payload: ${validationIssue}.`);
        return;
      }
      const realtimeEventId =
        typeof event?.event_id === "string" ? event.event_id : "";
      if (realtimeEventId) {
        if (state.processedRealtimeEventIds.has(realtimeEventId)) return;
        state.processedRealtimeEventIds.add(realtimeEventId);
        if (state.processedRealtimeEventIds.size > 2000) {
          const oldest = state.processedRealtimeEventIds.values().next().value;
          state.processedRealtimeEventIds.delete(oldest);
        }
      }
      if (event.type === "error") {
        appendBubble("system", `Realtime error: ${event.error?.message || "Unknown error"}`);
        return;
      }

      if (event.type === "response.created") {
        state.activeResponseId = event.response?.id || event.response_id || null;
        state.activePlaybackStartSeconds = Number(el.pjAudio.currentTime || 0);
        el.pjAudio.play().catch(() => {});
        return;
      }

      if (event.type === "input_audio_buffer.speech_started") {
        const item = state.realtimeItems.get(state.activeAssistantItemId);
        if (
          item &&
          state.dataChannel &&
          state.dataChannel.readyState === "open"
        ) {
          const playbackStart = Number(
            state.activePlaybackStartSeconds
            ?? el.pjAudio.currentTime
            ?? 0,
          );
          const playbackMs = Math.max(
            0,
            Math.floor(
              (Number(el.pjAudio.currentTime || 0) - playbackStart) * 1000,
            ),
          );
          el.pjAudio.pause();
          sendRealtimeEvent({
            type: "conversation.item.truncate",
            item_id: state.activeAssistantItemId,
            content_index: 0,
            audio_end_ms: playbackMs,
          });
          sendRealtimeEvent({ type: "response.cancel" });
          item.status = "interrupted";
          item.playbackMs = playbackMs;
          item.bubble.dataset.status = "interrupted";
          persistAssistantRealtimeItem(item, "interrupted", playbackMs);
        }
        finalizeAssistantBubble();
        return;
      }

      if (
        event.type ===
        "conversation.item.input_audio_transcription.delta"
      ) {
        const externalId = requireRealtimeItemId(event, "input");
        if (!externalId) return;
        upsertRealtimeBubble(
          externalId,
          "user",
          event.delta || "",
          { append: true, status: "streaming" },
        );
        return;
      }

      if (event.type === "conversation.item.input_audio_transcription.completed") {
        handleCompletedAudioTranscript(event);
        return;
      }

      if (
        event.type === "response.output_text.delta" ||
        event.type === "response.output_audio_transcript.delta"
      ) {
        const externalId = requireRealtimeItemId(event, "output");
        if (!externalId) return;
        const item = upsertRealtimeBubble(
          externalId,
          "assistant",
          event.delta || "",
          {
            append: true,
            status: "streaming",
            responseId: event.response_id || state.activeResponseId,
            source: event.type.includes("output_audio")
              ? "output_audio"
              : "output_text",
          },
        );
        item.externalId = externalId;
        state.activeAssistantItemId = externalId;
        if (item.responseId) {
          state.responseItems.set(item.responseId, externalId);
        }
        return;
      }

      if (
        event.type === "response.output_text.done" ||
        event.type === "response.output_audio_transcript.done"
      ) {
        const externalId = requireRealtimeItemId(event, "output");
        if (!externalId) return;
        const finalText = event.transcript ?? event.text;
        const item = upsertRealtimeBubble(
          externalId,
          "assistant",
          finalText ?? state.realtimeItems.get(externalId)?.text ?? "",
          {
            status: "awaiting_response_status",
            responseId: event.response_id || state.activeResponseId,
            source: event.type.includes("output_audio")
              ? "output_audio"
              : "output_text",
          },
        );
        item.externalId = externalId;
        state.activeAssistantItemId = externalId;
        finalizeAssistantBubble();
        return;
      }

      if (event.type === "response.done") {
        const response = event.response || {};
        const status = response.status === "completed"
          ? "completed"
          : response.status === "cancelled"
            ? "interrupted"
            : "failed";
        const outputIds = (response.output || [])
          .map((item) => item?.id)
          .filter(Boolean);
        if (!outputIds.length && state.activeAssistantItemId) {
          outputIds.push(state.activeAssistantItemId);
        }
        for (const externalId of outputIds) {
          const item = state.realtimeItems.get(externalId);
          if (!item) continue;
          const finalStatus = item.status === "interrupted"
            ? "interrupted"
            : status;
          item.status = finalStatus;
          item.bubble.dataset.status = finalStatus;
          persistAssistantRealtimeItem(
            { ...item, externalId },
            finalStatus,
            finalStatus === "interrupted"
              ? item.playbackMs ?? 0
              : null,
          );
        }
        state.activeAssistantItemId = null;
        state.activeResponseId = null;
        state.activePlaybackStartSeconds = null;
        finalizeAssistantBubble();
        return;
      }

      if (event.type === "response.function_call_arguments.delta") {
        const call = state.pendingCalls[event.call_id] || (state.pendingCalls[event.call_id] = {
          name: event.name,
          args: "",
          started: false,
        });
        call.args += event.delta || "";
        if (!call.started) {
          call.started = true;
          renderFullPowerTool({
            type: "tool.call",
            call_id: event.call_id,
            name: event.name || call.name,
            tool_type: "function_call",
          }, false);
        }
        return;
      }

      if (event.type === "response.function_call_arguments.done") {
        const call = state.pendingCalls[event.call_id] || {
          name: event.name,
          args: event.arguments || "",
        };
        call.name = event.name || call.name;
        call.args = event.arguments ?? call.args;
        runFunctionCall(event.call_id, call.name, call.args, apiBase);
        return;
      }

      if (event.type === "response.output_item.done" && event.item && event.item.type === "function_call") {
        const item = event.item;
        if (!(item.call_id in state.pendingCalls) || !state.pendingCalls[item.call_id].dispatched) {
          runFunctionCall(item.call_id, item.name, item.arguments, apiBase);
        }
      }
    }

    async function runFunctionCall(callId, name, argsJson, apiBase) {
      if (state.pendingCalls[callId]) state.pendingCalls[callId].dispatched = true;
      else state.pendingCalls[callId] = { dispatched: true };

      let args = {};
      try {
        args = argsJson ? JSON.parse(argsJson) : {};
      } catch (error) {
        appendBubble("system", `Tool argument parse failed (${name}): ${String(error)}`);
      }

      let output;
      const requestId = createRequestId();
      try {
        const resp = await fetchWithTimeout(`${apiBase}/execute-tool`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-pj-client-request-id": requestId,
            "x-pj-contract-version": CONTRACT_VERSION,
            "x-pj-protocol-version": String(PROTOCOL_VERSION),
          },
          body: JSON.stringify(protocolMessage({
            name,
            arguments: args,
            session_id: state.fullPowerSessionId || undefined,
          })),
        }, name === "delegate_advanced_task" ? 290000 : 90000);
        const raw = await resp.text();
        let protocolPayload = null;
        try {
          protocolPayload = raw ? JSON.parse(raw) : null;
        } catch (_) {}
        assertProtocolResponse(resp, protocolPayload);
        if (!resp.ok) {
          output = JSON.stringify({
            error: `Tool call failed (${resp.status})`,
            detail: parseErrorBody(raw),
          });
        } else {
          output = raw;
        }
      } catch (error) {
        output = JSON.stringify({ error: String(error) });
      }

      let parsedOutput = output;
      try {
        parsedOutput = JSON.parse(output);
      } catch (_) {
        // Keep non-JSON tool output as text.
      }
      renderFullPowerTool({
        type: "tool.result",
        call_id: callId,
        name,
        result: parsedOutput,
      }, true);
      if (parsedOutput?.artifact) {
        renderArtifactCard(parsedOutput.artifact);
      }

      if (state.dataChannel && state.dataChannel.readyState === "open") {
        sendRealtimeEvent({
          type: "conversation.item.create",
          item: { type: "function_call_output", call_id: callId, output },
        });
        sendRealtimeEvent({ type: "response.create" });
      }

      delete state.pendingCalls[callId];
    }

    async function copyTranscript() {
      const lines = Array.from(el.messages.querySelectorAll(".bubble")).map((node) => node.textContent);
      try {
        await navigator.clipboard.writeText(lines.join("\n\n"));
        appendBubble("system", "Transcript copied.");
      } catch (_) {
        appendBubble("system", "Clipboard copy failed.");
      }
    }

    function clearTranscript() {
      el.messages.innerHTML = "";
      resetFullPowerRenderState();
      finalizeAssistantBubble();
    }

    el.startBtn.addEventListener("click", startSelectedMode);
    el.stopBtn.addEventListener("click", stopSelectedMode);
    el.sendBtn.addEventListener("click", sendSelectedMessage);
    el.copyBtn.addEventListener("click", copyTranscript);
    el.clearBtn.addEventListener("click", clearTranscript);
    el.composerFilesBtn.addEventListener("click", () => {
      el.filePicker.value = "";
      el.filePicker.click();
    });
    el.composerFolderBtn.addEventListener("click", () => {
      el.folderPicker.value = "";
      el.folderPicker.click();
    });
    el.filePicker.addEventListener("change", () => {
      selectUploadItems(el.filePicker.files, "files");
      uploadSelectedDocuments();
    });
    el.folderPicker.addEventListener("change", () => {
      selectUploadItems(el.folderPicker.files, "folder");
      uploadSelectedDocuments();
    });
    el.refreshCapabilitiesBtn.addEventListener("click", async () => {
      const base = apiBase();
      if (!base) {
        setStatus("Set a valid server URL");
        return;
      }
      el.capabilityStatus.textContent = "Capability mode: refreshing...";
      const info = await refreshCurrentCapabilities({ forceRefresh: true });
      if (info) {
        const count = info.count ?? info.local_functions?.count ?? 0;
        appendBubble("system", `Capability catalog refreshed: ${count} local tools loaded.`);
      }
    });
    el.realtimeModeBtn.addEventListener("click", () => setMode(MODE.REALTIME));
    el.fullPowerVoiceModeBtn.addEventListener(
      "click",
      () => setMode(MODE.FULL_POWER_VOICE),
    );
    el.fullPowerModeBtn.addEventListener("click", () => setMode(MODE.FULL_POWER));
    el.refreshSessionsBtn.addEventListener("click", refreshFullPowerSessions);
    el.sessionSelect.addEventListener("change", () => {
      if (el.sessionSelect.value) resumeFullPowerSession(el.sessionSelect.value);
    });
    el.searchHistoryBtn.addEventListener("click", async () => {
      const query = el.historySearch.value.trim();
      if (!query) return;
      try {
        const parsed = await fetchJson(
          `${apiBase()}/responses/sessions/search?q=${encodeURIComponent(query)}&limit=20`,
          { headers: requestHeaders(createRequestId()) },
        );
        const matches = parsed.matches || [];
        appendBubble("system", matches.length
          ? `History matches:\n${matches.map((match) => `${match.title}: ${shorten(match.content, 180)}`).join("\n")}`
          : "No matching conversation history.");
      } catch (error) {
        appendBubble("system", `History search failed: ${shorten(String(error), 240)}`);
      }
    });
    el.textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendSelectedMessage();
      }
    });

    setPhase(PHASE.IDLE, "Idle");
    appendBubble("system", "Ready. Click Start Session to connect to PJ.");
    refreshCurrentCapabilities({ forceRefresh: false });
  </script>
</body>
</html>
