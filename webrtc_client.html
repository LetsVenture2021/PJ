<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJ Web App</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --panel-2: #172338;
      --text: #e6edf7;
      --muted: #9fb1c9;
      --line: #243149;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --brand: #3b82f6;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at top, #15233a 0%, var(--bg) 42%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      min-height: 100%;
    }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, #0f1828 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .sidebar {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
      position: sticky;
      top: 16px;
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.12);
    }

    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.13);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    input, button, textarea, select {
      font: inherit;
      color: inherit;
    }

    input[type="text"], select {
      width: 100%;
      background: #0d1524;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #3b82f680;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1524;
    }

    .mode-switch button {
      padding: 8px 6px;
      background: transparent;
      color: var(--muted);
    }

    .mode-switch button.active {
      background: #1f4f87;
      color: #fff;
      border-color: #3b82f6;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      background: #1a2941;
      transition: 120ms ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .primary { background: var(--brand); color: #fff; border-color: #4f93ff; }
    .danger { background: #3a1a20; color: #fecaca; border-color: #7f1d1d; }
    .muted-btn { background: #102036; border-color: var(--line); color: #d8e5f8; }

    .note {
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      background: #0d1524;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }

    .hidden { display: none !important; }

    .full-power-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }

    details.structured-output {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0d1524;
      padding: 9px 10px;
    }

    details.structured-output summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    details.structured-output textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #09111f;
      color: var(--text);
    }

    .full-width-btn {
      width: 100%;
    }

    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 72vh;
      overflow: hidden;
    }

    .chat-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, #172338, #152136);
    }

    .chat-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .messages {
      padding: 18px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
        #0c1526;
    }

    .bubble {
      max-width: 85%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .bubble.user {
      align-self: flex-end;
      background: #12355f;
      border-color: #2b5d95;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #15243b;
    }

    .bubble.system {
      align-self: center;
      max-width: 92%;
      background: #251f10;
      border-color: #6a4f1e;
      color: #fde68a;
      font-size: 13px;
    }

    .approval-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .approval-actions button {
      padding: 7px 12px;
    }

    .bubble.tool-status {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      width: min(92%, 680px);
    }

    .tool-status-indicator {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--warn);
    }

    .tool-status.completed .tool-status-indicator {
      background: var(--ok);
    }

    .artifact-card {
      align-self: flex-start;
      width: min(92%, 680px);
      padding: 14px;
      border: 1px solid #2b5d95;
      border-radius: 12px;
      background: linear-gradient(135deg, #142a47, #102036);
      display: grid;
      gap: 9px;
    }

    .artifact-card-title {
      font-weight: 700;
      word-break: break-word;
      color: #fff;
    }

    .artifact-image-preview {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 8px;
      background: #0b1422;
    }

    .artifact-card-meta {
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .artifact-download {
      width: fit-content;
      color: #fff;
      background: var(--brand);
      border: 1px solid #4f93ff;
      border-radius: 9px;
      padding: 8px 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .upload-input {
      display: none;
    }

    .composer {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      background: #101b2e;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      background: #0d1524;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      outline: none;
    }
    .composer textarea:focus {
      border-color: #3b82f680;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .composer button {
      min-width: 120px;
      align-self: stretch;
    }

    .composer .composer-icon-btn {
      min-width: 44px;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #0d1524;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
    }
    .composer .composer-icon-btn:hover:not(:disabled) {
      color: var(--text);
      border-color: #3b82f680;
    }
    .composer .composer-icon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 940px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
      }
      .chat {
        min-height: 65vh;
      }
      .bubble { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="card sidebar">
      <div>
        <h1 class="title">PJ Web App</h1>
        <p class="sub">Realtime voice and full-power PJ workspace</p>
      </div>

      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Idle</span>
      </div>

      <div class="mode-switch" aria-label="Assistant mode">
        <button id="realtimeModeBtn" class="active" type="button">Fast Voice</button>
        <button id="fullPowerVoiceModeBtn" type="button">Full Power Voice</button>
        <button id="fullPowerModeBtn" type="button">Full Power Text</button>
      </div>

      <div class="field">
        <label for="apiBase">Server URL</label>
        <input id="apiBase" type="text" placeholder="http://localhost:3001">
      </div>

      <div class="button-row">
        <button id="startBtn" class="primary">Start Session</button>
        <button id="stopBtn" class="danger" disabled>End Session</button>
      </div>

      <div id="modeNote" class="note">
        Voice mode requires microphone permission. You can still send text
        messages once the realtime session is connected.
      </div>

      <div id="fullPowerControls" class="full-power-controls hidden">
        <div class="field">
          <label for="sessionSelect">Conversation history</label>
          <select id="sessionSelect">
            <option value="">No saved conversations loaded</option>
          </select>
        </div>
        <button id="refreshSessionsBtn" class="muted-btn full-width-btn" type="button">Refresh History</button>
        <div class="search-row">
          <input id="historySearch" type="text" placeholder="Search chat history">
          <button id="searchHistoryBtn" class="muted-btn" type="button">Search</button>
        </div>
        <details id="structuredOutputPanel" class="structured-output">
          <summary>Structured JSON output</summary>
          <div class="field">
            <label for="schemaName">Schema name</label>
            <input id="schemaName" type="text" value="pj_response">
          </div>
          <textarea id="schemaJson" spellcheck="false" placeholder='{"type":"object","properties":{},"additionalProperties":false}'></textarea>
        </details>
      </div>

      <button id="refreshCapabilitiesBtn" class="muted-btn full-width-btn">Refresh Capabilities</button>
      <div id="capabilityStatus" class="note">Capability mode: checking...</div>
      <div id="toolSummary" class="note">Tool catalog not loaded yet.</div>
    </aside>

    <main class="card chat">
      <div class="chat-head">
        <h2>Conversation</h2>
        <div class="head-actions">
          <button id="copyBtn" class="muted-btn">Copy Transcript</button>
          <button id="clearBtn" class="muted-btn">Clear</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <input id="filePicker" class="upload-input" type="file" multiple>
        <input
          id="folderPicker"
          class="upload-input"
          type="file"
          webkitdirectory
          directory
          multiple
        >
        <button
          id="composerFilesBtn"
          class="composer-icon-btn"
          type="button"
          title="Upload documents"
          aria-label="Upload documents"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button
          id="composerFolderBtn"
          class="composer-icon-btn"
          type="button"
          title="Upload a folder"
          aria-label="Upload a folder"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
        </button>
        <textarea id="textInput" placeholder="Type a message to PJ..." disabled></textarea>
        <button id="sendBtn" class="primary" disabled>Send</button>
      </div>
    </main>
  </div>

  <audio id="pjAudio" autoplay></audio>

  <script type="module">
    // The ?v= query busts stale cached copies of the module; bump it whenever
    // pj_web_utils.js changes exports, or the import dies on cached clients.
    import {
      CONTRACT_VERSION,
      PROTOCOL_VERSION,
      assertProtocolResponse,
      createRequestId,
      protocolMessage,
      shorten,
      parseErrorBody,
      fetchWithTimeout,
    } from "/assets/pj_web_utils.js?v=2026-07-28.6";

    const localHostnames = new Set(["localhost", "127.0.0.1"]);
    const DEFAULT_API_BASE = localHostnames.has(window.location.hostname)
      ? `${window.location.protocol}//${window.location.hostname}:3001`
      : window.location.hostname === "www.pj-assistant.ai"
        ? "https://pj-assistant.ai"
        : window.location.origin;
    const STORAGE_KEY = "pj-web-app-api-base";
    const PHASE = {
      IDLE: "idle",
      CONNECTING: "connecting",
      LIVE: "live",
      STOPPING: "stopping",
    };
    const MODE = {
      REALTIME: "fast_voice",
      FULL_POWER_VOICE: "full_power_voice",
      FULL_POWER: "full_power_text",
    };

    const el = {
      apiBase: document.getElementById("apiBase"),
      startBtn: document.getElementById("startBtn"),
      stopBtn: document.getElementById("stopBtn"),
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      messages: document.getElementById("messages"),
      textInput: document.getElementById("textInput"),
      sendBtn: document.getElementById("sendBtn"),
      copyBtn: document.getElementById("copyBtn"),
      clearBtn: document.getElementById("clearBtn"),
      pjAudio: document.getElementById("pjAudio"),
      refreshCapabilitiesBtn: document.getElementById("refreshCapabilitiesBtn"),
      capabilityStatus: document.getElementById("capabilityStatus"),
      toolSummary: document.getElementById("toolSummary"),
      realtimeModeBtn: document.getElementById("realtimeModeBtn"),
      fullPowerVoiceModeBtn: document.getElementById("fullPowerVoiceModeBtn"),
      fullPowerModeBtn: document.getElementById("fullPowerModeBtn"),
      modeNote: document.getElementById("modeNote"),
      fullPowerControls: document.getElementById("fullPowerControls"),
      sessionSelect: document.getElementById("sessionSelect"),
      refreshSessionsBtn: document.getElementById("refreshSessionsBtn"),
      historySearch: document.getElementById("historySearch"),
      searchHistoryBtn: document.getElementById("searchHistoryBtn"),
      structuredOutputPanel: document.getElementById("structuredOutputPanel"),
      schemaName: document.getElementById("schemaName"),
      schemaJson: document.getElementById("schemaJson"),
      composerFilesBtn: document.getElementById("composerFilesBtn"),
      composerFolderBtn: document.getElementById("composerFolderBtn"),
      filePicker: document.getElementById("filePicker"),
      folderPicker: document.getElementById("folderPicker"),
    };

    const state = {
      pc: null,
      dataChannel: null,
      micStream: null,
      pendingCalls: {},
      activeAssistantBubble: null,
      phase: PHASE.IDLE,
      activeStartRequestId: null,
      liveAnnounced: false,
      toolCatalog: null,
      mode: MODE.REALTIME,
      fullPowerSessionId: null,
      activeSessionId: null,
      fullPowerBusy: false,
      responsesAbortController: null,
      capabilityManifest: null,
      pendingApprovals: {},
      fullPowerToolRows: new Map(),
      artifactCards: new Map(),
      realtimeItems: new Map(),
      responseItems: new Map(),
      activeAssistantItemId: null,
      activeResponseId: null,
      pendingSeedHistory: [],
      seededSessionIds: new Set(),
      perfectedInputItems: new Set(),
      processedRealtimeEventIds: new Set(),
      persistedRealtimeStates: new Map(),
      missingRealtimeIds: new Set(),
      activePlaybackStartSeconds: null,
      uploadMode: "files",
      uploadItems: [],
      uploadBusy: false,
      uploadSessionId: `upload_${createRequestId().replace(/[^A-Za-z0-9_-]/g, "_")}`,
    };

    const savedBase = localStorage.getItem(STORAGE_KEY);
    el.apiBase.value = savedBase || DEFAULT_API_BASE;

    function setStatus(text, kind = "idle") {
      el.statusText.textContent = text;
      el.statusDot.classList.toggle("live", kind === "live");
    }

    function apiBase() {
      return el.apiBase.value.trim().replace(/\/+$/, "");
    }

    function requestHeaders(requestId, contentType = null) {
      const headers = {
        Accept: "application/json",
        "x-pj-client-request-id": requestId,
        "x-pj-contract-version": CONTRACT_VERSION,
        "x-pj-protocol-version": String(PROTOCOL_VERSION),
      };
      if (contentType) headers["Content-Type"] = contentType;
      return headers;
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${unit === 0 ? value : value.toFixed(1)} ${units[unit]}`;
    }

    function setUploadBusy(busy) {
      state.uploadBusy = busy;
      el.composerFilesBtn.disabled = busy;
      el.composerFolderBtn.disabled = busy;
    }

    function selectUploadItems(fileList, mode) {
      state.uploadMode = mode;
      state.uploadItems = Array.from(fileList).map((file) => ({
        file,
        path: mode === "folder" ? file.webkitRelativePath : file.name,
      }));
    }

    function uploadSessionId() {
      return state.activeSessionId || state.fullPowerSessionId || state.uploadSessionId;
    }

    async function uploadSelectedDocuments() {
      if (state.uploadBusy || !state.uploadItems.length) return;
      if (!apiBase()) {
        setStatus("Set a valid server URL");
        return;
      }

      setUploadBusy(true);
      const count = state.uploadItems.length;
      const label = state.uploadMode === "folder"
        ? `folder (${count} file${count === 1 ? "" : "s"})`
        : `${count} document${count === 1 ? "" : "s"}`;
      const statusBubble = appendBubble("system", `Uploading ${label}...`);

      const form = new FormData();
      form.append("session_id", uploadSessionId());
      for (const item of state.uploadItems) {
        form.append("files", item.file, item.file.name);
        form.append("paths", item.path);
      }
      const requestId = createRequestId();
      const endpoint = state.uploadMode === "folder" ? "/upload/folder" : "/upload/files";

      try {
        const parsed = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", `${apiBase()}${endpoint}`);
          xhr.withCredentials = true;
          xhr.timeout = 120000;
          for (const [name, value] of Object.entries(requestHeaders(requestId))) {
            xhr.setRequestHeader(name, value);
          }
          xhr.setRequestHeader("x-pj-session-id", uploadSessionId());

          // Watchdog: an upload with no activity for 30s becomes a terminal
          // error instead of a bubble that spins until the 120s timeout.
          let lastActivity = performance.now();
          const watchdog = setInterval(() => {
            if (performance.now() - lastActivity > 30000) {
              clearInterval(watchdog);
              xhr.abort();
              reject(new Error(
                "Upload stalled for 30 seconds without progress (upload_no_terminal_state).",
              ));
            }
          }, 5000);
          const settle = (fn) => (value) => { clearInterval(watchdog); fn(value); };
          const settleResolve = settle(resolve);
          const settleReject = settle(reject);

          xhr.upload.addEventListener("progress", (event) => {
            lastActivity = performance.now();
            if (event.lengthComputable) {
              const pct = Math.round((event.loaded / event.total) * 100);
              statusBubble.textContent = `Uploading ${label}... ${pct}%`;
            }
          });
          xhr.addEventListener("load", () => {
            const responseType = (xhr.getResponseHeader("content-type") || "").toLowerCase();
            if (responseType.includes("text/html") || /^\s*</.test(xhr.responseText || "")) {
              settleReject(new Error(
                "Upload blocked before reaching PJ (upload_edge_challenged): the edge " +
                "returned an HTML challenge page. Verify the WAF skip rule covers /upload/*.",
              ));
              return;
            }
            let payload;
            try {
              payload = xhr.responseText ? JSON.parse(xhr.responseText) : {};
              assertProtocolResponse(
                { headers: { get: (name) => xhr.getResponseHeader(name) } },
                payload,
              );
            } catch (_) {
              settleReject(new Error("Upload response was not valid PJ JSON."));
              return;
            }
            if (xhr.status < 200 || xhr.status >= 300) {
              const detail = parseErrorBody(xhr.responseText);
              settleReject(
                new Error(`Upload failed (${xhr.status})${detail ? `: ${detail}` : ""}`),
              );
              return;
            }
            settleResolve(payload);
          });
          xhr.addEventListener("error", () => settleReject(new Error(
            "Upload network request failed (upload_bridge_unreachable).",
          )));
          xhr.addEventListener("timeout", () => settleReject(new Error(
            "Upload request timed out (upload_no_terminal_state).",
          )));
          xhr.send(form);
        });

        const totalBytes = (parsed.files || []).reduce(
          (sum, file) => sum + (file.size || 0),
          0,
        );
        const skippedFiles = parsed.skipped || [];
        statusBubble.textContent =
          `Uploaded ${parsed.count} document${parsed.count === 1 ? "" : "s"} ` +
          `(${formatBytes(totalBytes)}) to DocOps.` +
          (skippedFiles.length
            ? ` Skipped ${skippedFiles.length} file${skippedFiles.length === 1 ? "" : "s"}` +
              ` (${skippedFiles[0].code}).`
            : "");
      } catch (error) {
        statusBubble.textContent = shorten(String(error), 300);
      } finally {
        setUploadBusy(false);
        state.uploadItems = [];
      }
    }

    function validateOutboundRealtimeEvent(payload) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
        return "payload must be an object";
      }
      if (typeof payload.type !== "string" || !payload.type) {
        return "type is required";
      }
      if (payload.type === "conversation.item.create") {
        if (!payload.item || typeof payload.item !== "object" || Array.isArray(payload.item)) {
          return "item is required";
        }
        if (payload.item.type === "message") {
          if (!["user", "assistant"].includes(payload.item.role)) {
            return "item.role must be user or assistant";
          }
          if (
            !Array.isArray(payload.item.content)
            || !payload.item.content.length
            || payload.item.content.some(
              (part) => !part || typeof part.type !== "string" || typeof part.text !== "string",
            )
          ) {
            return "item.content must contain typed text parts";
          }
        } else if (payload.item.type === "function_call_output") {
          if (typeof payload.item.call_id !== "string" || !payload.item.call_id) {
            return "item.call_id is required";
          }
          if (typeof payload.item.output !== "string") {
            return "item.output must be a string";
          }
        } else {
          return "item.type is unsupported";
        }
      } else if (["conversation.item.delete", "conversation.item.truncate"].includes(payload.type)) {
        if (typeof payload.item_id !== "string" || !payload.item_id) {
          return "item_id is required";
        }
        if (
          payload.type === "conversation.item.truncate"
          && (
            !Number.isInteger(payload.content_index)
            || !Number.isInteger(payload.audio_end_ms)
            || payload.audio_end_ms < 0
          )
        ) {
          return "truncate offsets must be non-negative integers";
        }
      } else if (!["response.create", "response.cancel"].includes(payload.type)) {
        return `unsupported type ${payload.type}`;
      }
      return null;
    }

    function sendRealtimeEvent(payload) {
      const issue = validateOutboundRealtimeEvent(payload);
      if (issue) {
        throw new Error(`Invalid outbound realtime payload: ${issue}.`);
      }
      if (!state.dataChannel || state.dataChannel.readyState !== "open") {
        throw new Error("Realtime data channel is not open.");
      }
      state.dataChannel.send(JSON.stringify(payload));
    }

    function validateInboundRealtimeEvent(event) {
      if (!event || typeof event !== "object" || Array.isArray(event)) {
        return "payload must be an object";
      }
      if (typeof event.type !== "string" || !event.type) {
        return "type is required";
      }
      const hasItemId = Boolean(realtimeItemId(event, "item"));
      if (event.type === "error") {
        if (!event.error || typeof event.error.message !== "string") {
          return "error.message is required";
        }
      } else if (event.type === "response.created") {
        if (typeof (event.response?.id || event.response_id) !== "string") {
          return "response identifier is required";
        }
      } else if (
        event.type === "conversation.item.input_audio_transcription.delta"
        || event.type === "response.output_text.delta"
        || event.type === "response.output_audio_transcript.delta"
      ) {
        if (!hasItemId) return "item identifier is required";
        if (typeof event.delta !== "string") return "delta must be a string";
      } else if (
        event.type === "conversation.item.input_audio_transcription.completed"
        || event.type === "response.output_text.done"
        || event.type === "response.output_audio_transcript.done"
      ) {
        if (!hasItemId) return "item identifier is required";
        if (typeof (event.transcript ?? event.text) !== "string") {
          return "completed transcript text is required";
        }
      } else if (event.type === "response.done") {
        if (
          !event.response
          || typeof event.response !== "object"
          || typeof event.response.id !== "string"
          || typeof event.response.status !== "string"
        ) {
          return "response.id and response.status are required";
        }
        if (event.response.output !== undefined && !Array.isArray(event.response.output)) {
          return "response.output must be an array";
        }
      } else if (event.type === "response.function_call_arguments.delta") {
        if (typeof event.call_id !== "string" || !event.call_id) return "call_id is required";
        if (typeof event.delta !== "string") return "delta must be a string";
      } else if (event.type === "response.function_call_arguments.done") {
        if (typeof event.call_id !== "string" || !event.call_id) return "call_id is required";
        const pendingCall = state.pendingCalls[event.call_id];
        if (
          typeof event.name !== "string"
          && typeof pendingCall?.name !== "string"
        ) return "name is required";
        if (
          typeof event.arguments !== "string"
          && typeof pendingCall?.args !== "string"
        ) return "arguments must be a string";
      } else if (
        event.type === "response.output_item.done"
        && event.item?.type === "function_call"
      ) {
        if (
          typeof event.item.call_id !== "string"
          || typeof event.item.name !== "string"
          || typeof event.item.arguments !== "string"
        ) {
          return "function call item fields are required";
        }
      }
      return null;
    }

    function validateFullPowerEvent(event) {
      if (!event || typeof event !== "object" || Array.isArray(event)) {
        return "payload must be an object";
      }
      if (typeof event.type !== "string" || !event.type) return "type is required";
      const requiredFields = {
        "text.delta": ["delta"],
        "tool.call": ["call_id", "tool_type"],
        "tool.call.delta": ["call_id", "delta"],
        "tool.result": ["call_id"],
        "artifact.ready": ["artifact_id", "filename", "download_url"],
        "deliverable.incomplete": ["requested_format"],
        citation: ["citation"],
        source: ["source"],
        "approval.required": ["approval_id", "approval_kind", "session_id"],
        "approval.executing": ["approval_id", "approval_kind", "approved"],
        "approval.resolved": ["approval_id", "approval_kind", "approved"],
        completion: ["text", "session_id"],
        error: ["error"],
      };
      for (const field of requiredFields[event.type] || []) {
        if (!(field in event)) {
          return `${field} is required for ${event.type}`;
        }
      }
      return null;
    }

    function setPhase(phase, statusText = null) {
      state.phase = phase;
      if (phase === PHASE.IDLE) {
        el.startBtn.disabled = false;
        el.stopBtn.disabled = true;
        el.sendBtn.disabled = true;
        el.textInput.disabled = true;
      } else if (phase === PHASE.CONNECTING) {
        el.startBtn.disabled = true;
        el.stopBtn.disabled = false;
        el.sendBtn.disabled = true;
        el.textInput.disabled = true;
      } else if (phase === PHASE.LIVE) {
        el.startBtn.disabled = true;
        el.stopBtn.disabled = false;
        el.sendBtn.disabled = state.fullPowerBusy;
        el.textInput.disabled = false;
      } else {
        el.startBtn.disabled = true;
        el.stopBtn.disabled = true;
        el.sendBtn.disabled = true;
        el.textInput.disabled = true;
      }

      if (statusText) {
        setStatus(statusText, phase === PHASE.LIVE ? "live" : "idle");
      }
    }

    function setMode(mode) {
      if (!Object.values(MODE).includes(mode) || state.mode === mode) return;
      if (state.mode !== MODE.FULL_POWER) {
        stopSession({ announce: false });
      } else {
        stopFullPowerSession({ announce: false, preserveSession: true });
      }
      state.mode = mode;
      el.realtimeModeBtn.classList.toggle("active", mode === MODE.REALTIME);
      el.fullPowerVoiceModeBtn.classList.toggle(
        "active", mode === MODE.FULL_POWER_VOICE
      );
      el.fullPowerModeBtn.classList.toggle("active", mode === MODE.FULL_POWER);
      el.fullPowerControls.classList.toggle("hidden", mode !== MODE.FULL_POWER);
      el.startBtn.textContent = mode !== MODE.FULL_POWER
        ? "Start Session"
        : "New Conversation";
      el.stopBtn.textContent = mode !== MODE.FULL_POWER
        ? "End Session"
        : "Close Conversation";
      el.modeNote.textContent = mode === MODE.REALTIME
        ? "Fast Voice responds immediately through Realtime and stores finalized transcripts."
        : mode === MODE.FULL_POWER_VOICE
          ? "Full Power Voice refines each completed transcript before PJ responds and preserves the original wording in shared history."
          : "Full Power Text uses PJ's terminal-equivalent Responses runtime: web and file search, MCP, local tools, citations, structured output, and shared history.";
      const idleText = mode === MODE.REALTIME
        ? "Fast Voice idle"
        : mode === MODE.FULL_POWER_VOICE
          ? "Full Power Voice idle"
          : "Full Power Text idle";
      setPhase(PHASE.IDLE, idleText);
      appendBubble(
        "system",
        mode === MODE.REALTIME
          ? "Fast Voice selected."
          : mode === MODE.FULL_POWER_VOICE
            ? "Full Power Voice selected."
            : "Full Power Text selected. Start or resume a conversation.",
      );
      refreshCurrentCapabilities({ forceRefresh: false });
      if (mode === MODE.FULL_POWER) refreshFullPowerSessions();
    }

    function appendBubble(role, text, append = false) {
      if (append && role === "assistant" && state.activeAssistantBubble) {
        state.activeAssistantBubble.textContent += text;
        scrollMessagesToBottom();
        return state.activeAssistantBubble;
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      el.messages.appendChild(bubble);
      scrollMessagesToBottom();

      if (role === "assistant") {
        state.activeAssistantBubble = bubble;
      }
      return bubble;
    }

    function finalizeAssistantBubble() {
      state.activeAssistantBubble = null;
    }

    function resetFullPowerRenderState() {
      state.fullPowerToolRows.clear();
      state.artifactCards.clear();
    }

    function scrollMessagesToBottom() {
      el.messages.scrollTop = el.messages.scrollHeight;
    }

    async function checkBackendHealth(apiBase, requestId) {
      const response = await fetchWithTimeout(`${apiBase}/health`, {
        headers: requestHeaders(requestId),
        credentials: "include",
      }, 8000);

      const body = await response.text();
      if (!response.ok) {
        const detail = parseErrorBody(body);
        throw new Error(`Backend health check failed (${response.status})${detail ? `: ${detail}` : ""}`);
      }
      let parsed = {};
      try {
        parsed = body ? JSON.parse(body) : {};
      } catch (_) {
        parsed = {};
      }
      assertProtocolResponse(response, parsed);
      if (!parsed.ok) {
        throw new Error("Backend health endpoint did not return ok=true.");
      }
      return parsed;
    }

    function summarizeToolNames(tools, limit = 8) {
      if (!Array.isArray(tools) || !tools.length) {
        return "";
      }
      const names = tools
        .map((tool) => (tool && typeof tool.name === "string" ? tool.name : ""))
        .filter(Boolean);
      if (!names.length) {
        return "";
      }
      const shown = names.slice(0, limit);
      const remainder = names.length - shown.length;
      return remainder > 0
        ? `${shown.join(", ")} +${remainder} more`
        : shown.join(", ");
    }

    async function fetchToolSchemas(apiBase, requestId, forceRefresh = false) {
      const url = new URL(`${apiBase}/tool-schemas`);
      if (forceRefresh) {
        url.searchParams.set("refresh", "1");
      }
      const response = await fetchWithTimeout(url.toString(), {
        headers: requestHeaders(requestId),
        credentials: "include",
      }, 12000);

      const body = await response.text();
      if (!response.ok) {
        const detail = parseErrorBody(body);
        throw new Error(`Tool schema fetch failed (${response.status})${detail ? `: ${detail}` : ""}`);
      }

      let parsed = {};
      try {
        parsed = body ? JSON.parse(body) : {};
      } catch (_) {
        parsed = {};
      }
      assertProtocolResponse(response, parsed);
      const tools = Array.isArray(parsed.tools) ? parsed.tools : [];
      return {
        count: typeof parsed.count === "number" ? parsed.count : tools.length,
        source: typeof parsed.source === "string" ? parsed.source : "unknown",
        detail: typeof parsed.detail === "string" ? parsed.detail : "",
        tools,
      };
    }

    async function fetchJson(url, options = {}, timeoutMs = 15000) {
      const response = await fetchWithTimeout(url, {
        credentials: "include",
        ...options,
      }, timeoutMs);
      const body = await response.text();
      let parsed = {};
      try {
        parsed = body ? JSON.parse(body) : {};
      } catch (_) {
        throw new Error("Response payload was not valid JSON.");
      }
      assertProtocolResponse(response, parsed);
      if (!response.ok) {
        const detail = parseErrorBody(body);
        throw new Error(`Request failed (${response.status})${detail ? `: ${detail}` : ""}`);
      }
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        throw new Error("Response payload did not match the JSON object contract.");
      }
      return parsed;
    }

    async function ensureActiveSession(channel = "realtime") {
      if (state.activeSessionId) return state.activeSessionId;
      const parsed = await fetchJson(`${apiBase()}/responses/sessions`, {
        method: "POST",
        headers: requestHeaders(createRequestId(), "application/json"),
        body: JSON.stringify(protocolMessage({ title: "", channel })),
      });
      const sessionId = parsed.session?.id;
      if (!sessionId) throw new Error("Session response did not include an ID.");
      state.activeSessionId = sessionId;
      state.fullPowerSessionId = sessionId;
      state.pendingSeedHistory = [];
      return sessionId;
    }

    function upsertRealtimeBubble(
      externalId,
      role,
      text,
      {
        append = false,
        status = "streaming",
        responseId = null,
        source = null,
      } = {},
    ) {
      if (!externalId) return null;
      let item = state.realtimeItems.get(externalId);
      if (!item) {
        const bubble = appendBubble(role, "");
        finalizeAssistantBubble();
        item = {
          bubble,
          role,
          text: "",
          status,
          responseId,
          source,
        };
        state.realtimeItems.set(externalId, item);
      }
      item.text = append ? `${item.text}${text || ""}` : String(text || "");
      const nextStatus = item.status === "interrupted" ? "interrupted" : status;
      item.status = nextStatus;
      item.responseId = responseId || item.responseId;
      item.source = source || item.source;
      item.bubble.textContent = item.text;
      item.bubble.dataset.externalId = externalId;
      item.bubble.dataset.status = nextStatus;
      scrollMessagesToBottom();
      return item;
    }

    async function persistRealtimeMessage({
      externalId,
      role,
      content,
      source,
      responseId = null,
      status = "completed",
      playbackMs = null,
      metadata = {},
    }) {
      if (!state.activeSessionId || !externalId) return;
      await fetchJson(
        `${apiBase()}/responses/sessions/${encodeURIComponent(state.activeSessionId)}/realtime-messages`,
        {
          method: "POST",
          headers: requestHeaders(createRequestId(), "application/json"),
          body: JSON.stringify(protocolMessage({
            external_id: externalId,
            role,
            content,
            source,
            response_id: responseId,
            status,
            playback_ms: playbackMs,
            metadata,
          })),
        },
      );
    }

    async function loadSharedSessionHistory(sessionId, { clear = true } = {}) {
      const parsed = await fetchJson(
        `${apiBase()}/responses/sessions/${encodeURIComponent(sessionId)}/resume`,
        {
          method: "POST",
          headers: requestHeaders(createRequestId(), "application/json"),
          body: JSON.stringify(protocolMessage()),
        },
      );
      const session = parsed.session;
      if (!session?.id) throw new Error("Resume response did not include a session.");
      state.activeSessionId = session.id;
      state.fullPowerSessionId = session.id;
      state.pendingSeedHistory = (session.history || []).slice(-20);
      if (clear) {
        el.messages.innerHTML = "";
        state.realtimeItems.clear();
        resetFullPowerRenderState();
        finalizeAssistantBubble();
      }
      for (const item of session.history || []) {
        if (item.external_id) {
          upsertRealtimeBubble(
            item.external_id,
            item.role === "assistant" ? "assistant" : "user",
            item.content || "",
            {
              status: item.status || "completed",
              responseId: item.response_id || null,
            },
          );
        } else {
          appendBubble(
            item.role === "assistant" ? "assistant" : "user",
            item.content || "",
          );
          finalizeAssistantBubble();
        }
      }
      for (const artifact of session.artifacts || []) {
        renderArtifactCard(artifact);
      }
      return session;
    }

    function seedRealtimeConversation() {
      if (
        !state.activeSessionId ||
        state.seededSessionIds.has(state.activeSessionId) ||
        !state.dataChannel ||
        state.dataChannel.readyState !== "open"
      ) {
        return;
      }
      for (const item of state.pendingSeedHistory) {
        if (
          !["user", "assistant"].includes(item.role)
          || !item.content
          || (item.status && item.status !== "completed")
        ) continue;
        sendRealtimeEvent({
          type: "conversation.item.create",
          item: {
            type: "message",
            role: item.role,
            content: [{
              type: item.role === "assistant" ? "output_text" : "input_text",
              text: item.content,
            }],
          },
        });
      }
      state.seededSessionIds.add(state.activeSessionId);
    }

    function capabilityNames(manifest) {
      const native = Object.entries(manifest?.native || {})
        .filter(([, value]) => value?.status === "active")
        .map(([name]) => name);
      const mcp = (manifest?.mcp_servers || [])
        .filter((server) => ["active", "configured"].includes(server?.status))
        .map((server) => `mcp:${server.label}`);
      return [...native, ...mcp];
    }

    async function refreshFullPowerCapabilities(base, requestId) {
      try {
        const parsed = await fetchJson(
          `${base}/responses/capabilities`,
          { headers: requestHeaders(requestId) },
          12000,
        );
        const manifest = parsed.capabilities || {};
        state.capabilityManifest = manifest;
        const functionCount = manifest.local_functions?.count || 0;
        const names = capabilityNames(manifest);
        el.capabilityStatus.textContent =
          `Capability mode: Full Power [${functionCount} local functions] model ${manifest.model?.id || "unknown"}`;
        el.toolSummary.textContent = names.length
          ? `Native and connected tools: ${names.join(", ")}`
          : "Native and connected tools are unavailable.";
        return manifest;
      } catch (error) {
        state.capabilityManifest = null;
        el.capabilityStatus.textContent = "Capability mode: Full Power unavailable";
        el.toolSummary.textContent = `Capability error: ${shorten(String(error), 240)}`;
        return null;
      }
    }

    async function refreshCurrentCapabilities({ forceRefresh = false } = {}) {
      const base = apiBase();
      if (!base) return null;
      const requestId = createRequestId();
      if (state.mode === MODE.FULL_POWER) {
        return refreshFullPowerCapabilities(base, requestId);
      }
      return refreshCapabilities(base, requestId, { forceRefresh });
    }

    async function refreshCapabilities(apiBase, requestId, { health = null, forceRefresh = false } = {}) {
      try {
        const capabilityHealth = health || await checkBackendHealth(apiBase, requestId);
        const fallbackStatus = capabilityHealth.tool_bridge_configured
          ? "Capability mode: bridge configured, loading tool catalog..."
          : "Capability mode: direct realtime only (bridge not configured)";
        el.capabilityStatus.textContent = fallbackStatus;

        const schemaInfo = await fetchToolSchemas(apiBase, requestId, forceRefresh);
        state.toolCatalog = schemaInfo;

        const modePrefix = schemaInfo.count > 0
          ? "Capability mode: full tool catalog loaded"
          : "Capability mode: tool catalog empty";
        const detailSuffix = schemaInfo.detail ? ` (${schemaInfo.detail})` : "";
        el.capabilityStatus.textContent = `${modePrefix} [${schemaInfo.count}] via ${schemaInfo.source}${detailSuffix}`;

        const preview = summarizeToolNames(schemaInfo.tools);
        el.toolSummary.textContent = preview
          ? `Available tools: ${preview}`
          : "Available tools: none exposed by backend yet.";
        return schemaInfo;
      } catch (error) {
        state.toolCatalog = null;
        el.capabilityStatus.textContent = "Capability mode: tool catalog unavailable";
        el.toolSummary.textContent = `Tool catalog error: ${shorten(String(error), 240)}`;
        return null;
      }
    }

    function shouldUseEphemeralSignalingFallback(status, detail) {
      if (status >= 500 && status <= 599) {
        return true;
      }
      if (status !== 400) {
        return false;
      }
      const lowered = (detail || "").toLowerCase();
      return (
        lowered.includes("invalid_offer") ||
        lowered.includes("failed to parse offer") ||
        lowered.includes("unmarshal sdp") ||
        lowered.includes("eof")
      );
    }

    async function requestEphemeralClientSecret(apiBase, requestId) {
      const response = await fetchWithTimeout(`${apiBase}/token`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-pj-client-request-id": requestId,
          "x-pj-contract-version": CONTRACT_VERSION,
          "x-pj-protocol-version": String(PROTOCOL_VERSION),
        },
        body: JSON.stringify(protocolMessage({
          session_id: state.activeSessionId,
          voice_mode: state.mode === MODE.FULL_POWER_VOICE
            ? "full_power"
            : "fast",
        })),
        credentials: "include",
      }, 15000);

      const body = await response.text();
      if (!response.ok) {
        const detail = parseErrorBody(body);
        throw new Error(`Token minting failed (${response.status})${detail ? `: ${detail}` : ""}`);
      }

      let parsed = {};
      try {
        parsed = body ? JSON.parse(body) : {};
      } catch (_) {
        throw new Error("Token minting response was not valid JSON.");
      }
      assertProtocolResponse(response, parsed);

      const tokenValue =
        (parsed.client_secret && parsed.client_secret.value) ||
        parsed.value ||
        null;
      if (!tokenValue) {
        throw new Error("Token minting response did not include a client secret.");
      }
      return tokenValue;
    }

    async function negotiateWithEphemeralToken(apiBase, localSdp, requestId) {
      const ephemeralToken = await requestEphemeralClientSecret(apiBase, requestId);
      const response = await fetchWithTimeout("https://api.openai.com/v1/realtime/calls", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${ephemeralToken}`,
          "Content-Type": "application/sdp",
        },
        body: localSdp,
      }, 35000);

      const answerSdp = await response.text();
      if (!response.ok) {
        const detail = parseErrorBody(answerSdp);
        throw new Error(`Fallback signaling failed (${response.status})${detail ? `: ${detail}` : ""}`);
      }
      return answerSdp;
    }

    function markSessionLive() {
      setPhase(PHASE.LIVE, "Live");
      seedRealtimeConversation();
      if (!state.liveAnnounced) {
        appendBubble("system", "Session connected. You can speak or type.");
        state.liveAnnounced = true;
      }
      el.textInput.focus();
    }

    async function startSession() {
      if (state.phase !== PHASE.IDLE) return;

      const apiBase = el.apiBase.value.trim().replace(/\/+$/, "");
      if (!apiBase) {
        setStatus("Set a valid server URL");
        return;
      }
      localStorage.setItem(STORAGE_KEY, apiBase);

      const requestId = createRequestId();
      state.activeStartRequestId = requestId;
      state.liveAnnounced = false;

      try {
        setPhase(PHASE.CONNECTING, "Checking backend...");
        appendBubble(
          "system",
          state.mode === MODE.FULL_POWER_VOICE
            ? "Starting Full Power Voice session..."
            : "Starting Fast Voice session...",
        );
        const health = await checkBackendHealth(apiBase, requestId);
        await refreshCapabilities(apiBase, requestId, { health, forceRefresh: false });
        const hadSession = Boolean(state.activeSessionId);
        const sessionId = await ensureActiveSession("realtime");
        if (hadSession) {
          await loadSharedSessionHistory(sessionId, { clear: true });
        }
        state.seededSessionIds.delete(sessionId);
        if (state.activeStartRequestId !== requestId) return;

        setStatus("Requesting microphone...");
        state.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (state.activeStartRequestId !== requestId) {
          stopSession({ announce: false });
          return;
        }

        state.pc = new RTCPeerConnection();
        state.pc.ontrack = (event) => {
          el.pjAudio.srcObject = event.streams[0];
        };
        state.pc.oniceconnectionstatechange = () => {
          const ice = state.pc ? state.pc.iceConnectionState : "closed";
          if (ice === "failed" || ice === "disconnected") {
            setStatus(`Connection ${ice}`);
          }
        };

        state.micStream.getTracks().forEach((track) => {
          state.pc.addTrack(track, state.micStream);
        });

        state.dataChannel = state.pc.createDataChannel("oai-events");
        state.dataChannel.onopen = () => {
          if (state.phase === PHASE.CONNECTING) {
            markSessionLive();
          }
        };
        state.dataChannel.onclose = () => {
          if (state.phase !== PHASE.IDLE && state.phase !== PHASE.STOPPING) {
            appendBubble("system", "Realtime channel closed.");
            stopSession({ announce: false });
          }
        };
        state.dataChannel.onmessage = (event) => {
          let parsed;
          try {
            parsed = JSON.parse(event.data);
          } catch (_) {
            appendBubble("system", "Invalid inbound realtime payload: malformed JSON.");
            return;
          }
          handleRealtimeEvent(parsed, apiBase);
        };

        const offer = await state.pc.createOffer();
        await state.pc.setLocalDescription(offer);
        const localSdp = (
          state.pc.localDescription && state.pc.localDescription.sdp
        ) || offer.sdp || "";
        if (!localSdp.trim()) {
          throw new Error("Local SDP offer was empty before signaling.");
        }

        setStatus("Negotiating realtime session...");
        const voiceMode = state.mode === MODE.FULL_POWER_VOICE
          ? "full_power"
          : "fast";
        const signalingUrl = new URL(`${apiBase}/session`);
        signalingUrl.searchParams.set("session_id", state.activeSessionId);
        signalingUrl.searchParams.set("voice_mode", voiceMode);
        const response = await fetchWithTimeout(signalingUrl.href, {
          method: "POST",
          headers: {
            "Content-Type": "application/sdp",
            "x-pj-client-request-id": requestId,
            "x-pj-contract-version": CONTRACT_VERSION,
            "x-pj-protocol-version": String(PROTOCOL_VERSION),
          },
          body: localSdp,
          credentials: "include",
        }, 35000);

        let answerSdp = await response.text();
        assertProtocolResponse(response);
        if (!response.ok) {
          const detail = parseErrorBody(answerSdp);
          if (shouldUseEphemeralSignalingFallback(response.status, detail)) {
            appendBubble("system", "Primary signaling rejected SDP. Retrying with ephemeral token fallback...");
            setStatus("Retrying signaling with fallback...");
            answerSdp = await negotiateWithEphemeralToken(apiBase, localSdp, requestId);
          } else {
            throw new Error(`Signaling failed (${response.status})${detail ? `: ${detail}` : ""}`);
          }
        }

        if (state.activeStartRequestId !== requestId) {
          stopSession({ announce: false });
          return;
        }

        await state.pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
        if (state.dataChannel && state.dataChannel.readyState === "open") {
          markSessionLive();
        } else {
          setStatus("Awaiting realtime channel...");
        }
      } catch (error) {
        appendBubble("system", `Failed to start session: ${String(error)}`);
        stopSession({ announce: false });
        setPhase(PHASE.IDLE, "Idle");
      } finally {
        state.activeStartRequestId = null;
      }
    }

    function stopSession({ announce = true } = {}) {
      const hadSession =
        state.phase !== PHASE.IDLE || state.pc || state.dataChannel || state.micStream;

      state.activeStartRequestId = null;
      setPhase(PHASE.STOPPING, "Closing session...");

      if (state.dataChannel) {
        try { state.dataChannel.close(); } catch (_) {}
      }
      if (state.pc) {
        try { state.pc.close(); } catch (_) {}
      }
      if (state.micStream) {
        state.micStream.getTracks().forEach((track) => track.stop());
      }

      state.pc = null;
      state.dataChannel = null;
      state.micStream = null;
      state.pendingCalls = {};
      state.liveAnnounced = false;
      state.activePlaybackStartSeconds = null;
      finalizeAssistantBubble();

      setPhase(PHASE.IDLE, "Idle");
      if (announce && hadSession) {
        appendBubble("system", "Session ended.");
      }
    }

    async function sendTextMessage() {
      const message = el.textInput.value.trim();
      if (!message || state.phase !== PHASE.LIVE || !state.dataChannel || state.dataChannel.readyState !== "open") {
        return;
      }

      const externalId = `item_${crypto.randomUUID().replaceAll("-", "")}`;
      upsertRealtimeBubble(
        externalId,
        "user",
        message,
        { status: "completed" },
      );
      el.textInput.value = "";
      try {
        let submitted = message;
        let metadata = {};
        if (state.mode === MODE.FULL_POWER_VOICE) {
          setStatus("Refining prompt...", "live");
          const perfected = await perfectPrompt(
            message, "full_power_voice"
          );
          submitted = perfected.refined_prompt;
          metadata = {
            prompt_perfecting_version: perfected.version,
            refined_prompt: perfected.refined_prompt.slice(0, 4000),
            refined_prompt_truncated: perfected.refined_prompt.length > 4000,
            refined_sha256: perfected.refined_sha256,
            changed: perfected.changed,
          };
        }
        await persistRealtimeMessage({
          externalId,
          role: "user",
          content: message,
          source: "typed",
          metadata,
        });
        sendRealtimeEvent({
          type: "conversation.item.create",
          item: {
            id: externalId,
            type: "message",
            role: "user",
            content: [{ type: "input_text", text: submitted }],
          },
        });
        sendRealtimeEvent({ type: "response.create" });
        setStatus("Live", "live");
      } catch (error) {
        appendBubble(
          "system",
          `Message was not submitted: ${shorten(String(error), 260)}`,
        );
        setStatus("Live", "live");
      }
    }

    async function refreshFullPowerSessions() {
        if (state.mode !== MODE.FULL_POWER || !apiBase()) return;
        try {
          const parsed = await fetchJson(
            `${apiBase()}/responses/sessions?limit=50`,
            { headers: requestHeaders(createRequestId()) },
          );
          const sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
          el.sessionSelect.replaceChildren();
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = sessions.length
            ? "Select a saved conversation"
            : "No saved conversations";
          el.sessionSelect.appendChild(placeholder);
          for (const session of sessions) {
            const option = document.createElement("option");
            option.value = session.id;
            option.textContent = `${session.title || "(untitled)"} · ${session.channel || "terminal"} · ${session.messages || 0} messages`;
            option.selected = session.id === state.fullPowerSessionId;
            el.sessionSelect.appendChild(option);
          }
        } catch (error) {
          appendBubble("system", `History unavailable: ${shorten(String(error), 220)}`);
        }
      }

      async function startFullPowerSession() {
        if (state.phase !== PHASE.IDLE) return;
        const base = apiBase();
        if (!base) {
          setStatus("Set a valid server URL");
          return;
        }
        localStorage.setItem(STORAGE_KEY, base);
        setPhase(PHASE.CONNECTING, "Starting Full Power...");
        try {
          await checkBackendHealth(base, createRequestId());
          await refreshFullPowerCapabilities(base, createRequestId());
          if (state.activeSessionId) {
            await resumeFullPowerSession(state.activeSessionId);
            return;
          }
          const parsed = await fetchJson(`${base}/responses/sessions`, {
            method: "POST",
            headers: requestHeaders(createRequestId(), "application/json"),
            body: JSON.stringify(protocolMessage({ title: "" })),
          });
          state.fullPowerSessionId = parsed.session?.id || null;
          if (!state.fullPowerSessionId) throw new Error("Session response did not include an ID.");
          state.activeSessionId = state.fullPowerSessionId;
          el.messages.innerHTML = "";
          resetFullPowerRenderState();
          finalizeAssistantBubble();
          setPhase(PHASE.LIVE, "Full Power live");
          appendBubble("system", "Full Power conversation started.");
          await refreshFullPowerSessions();
          el.textInput.focus();
        } catch (error) {
          state.fullPowerSessionId = null;
          setPhase(PHASE.IDLE, "Full Power unavailable");
          appendBubble("system", `Unable to start Full Power: ${shorten(String(error), 300)}`);
        }
      }

      function stopFullPowerSession({
        announce = true,
        preserveSession = false,
      } = {}) {
        if (state.responsesAbortController) {
          state.responsesAbortController.abort();
        }
        const hadSession = Boolean(state.fullPowerSessionId);
        state.responsesAbortController = null;
        if (!preserveSession) {
          state.fullPowerSessionId = null;
          state.activeSessionId = null;
          state.pendingSeedHistory = [];
        }
        state.fullPowerBusy = false;
        state.pendingApprovals = {};
        resetFullPowerRenderState();
        finalizeAssistantBubble();
        setPhase(PHASE.IDLE, "Full Power idle");
        el.sessionSelect.value = "";
        if (announce && hadSession) appendBubble("system", "Full Power conversation closed.");
      }

      async function resumeFullPowerSession(sessionId) {
        if (!sessionId) return;
        stopFullPowerSession({ announce: false, preserveSession: true });
        setPhase(PHASE.CONNECTING, "Resuming conversation...");
        try {
          const parsed = await fetchJson(
            `${apiBase()}/responses/sessions/${encodeURIComponent(sessionId)}/resume`,
            {
              method: "POST",
              headers: requestHeaders(createRequestId(), "application/json"),
              body: JSON.stringify(protocolMessage()),
            },
          );
          const session = parsed.session;
          if (!session?.id) throw new Error("Resume response did not include a session.");
          state.fullPowerSessionId = session.id;
          state.activeSessionId = session.id;
          state.pendingSeedHistory = (session.history || []).slice(-20);
          el.messages.innerHTML = "";
          resetFullPowerRenderState();
          finalizeAssistantBubble();
          for (const item of session.history || []) {
            appendBubble(item.role === "assistant" ? "assistant" : "user", item.content || "");
            finalizeAssistantBubble();
          }
          for (const approval of session.pending_approvals || []) {
            renderFullPowerApproval({
              type: "approval.required",
              ...approval,
            });
          }
          for (const artifact of session.artifacts || []) {
            renderArtifactCard(artifact);
          }
          setPhase(PHASE.LIVE, "Full Power live");
          appendBubble("system", `Resumed: ${session.title || "(untitled)"}`);
          el.sessionSelect.value = session.id;
          el.textInput.focus();
        } catch (error) {
          state.fullPowerSessionId = null;
          setPhase(PHASE.IDLE, "Resume failed");
          appendBubble("system", `Unable to resume conversation: ${shorten(String(error), 300)}`);
        }
      }

      function structuredOutputRequest() {
        const raw = el.schemaJson.value.trim();
        if (!raw) return null;
        const name = el.schemaName.value.trim();
        if (!name) throw new Error("Structured output requires a schema name.");
        let schema;
        try {
          schema = JSON.parse(raw);
        } catch (error) {
          throw new Error(`Structured output schema is invalid JSON: ${error.message}`);
        }
        return { name, schema, strict: true };
      }

      function renderFullPowerApproval(event) {
        if (!event.approval_id || state.pendingApprovals[event.approval_id]) return;
        const target = event.server_label || event.name || "tool";
        const argumentsText = shorten(JSON.stringify(event.arguments || {}), 700);
        const bubble = appendBubble(
          "system",
          `Owner approval required for ${target}.\nArguments: ${argumentsText}`,
        );
        const controls = document.createElement("div");
        controls.className = "approval-actions";
        const approveButton = document.createElement("button");
        approveButton.type = "button";
        approveButton.textContent = "Approve";
        const rejectButton = document.createElement("button");
        rejectButton.type = "button";
        rejectButton.textContent = "Reject";
        const approvalState = {
          approveButton,
          rejectButton,
          decision: typeof event.execution_decision === "boolean"
            ? event.execution_decision
            : null,
        };
        state.pendingApprovals[event.approval_id] = approvalState;
        const decide = async (approve) => {
          approvalState.decision = approve;
          approveButton.disabled = true;
          rejectButton.disabled = true;
          await resolveFullPowerApproval(event.approval_id, approve);
        };
        approveButton.addEventListener("click", () => decide(true));
        rejectButton.addEventListener("click", () => decide(false));
        controls.appendChild(approveButton);
        controls.appendChild(rejectButton);
        bubble.appendChild(controls);
        if (approvalState.decision !== null) {
          approveButton.disabled = !approvalState.decision;
          rejectButton.disabled = approvalState.decision;
        }
      }

      function fullPowerToolKey(event) {
        return String(
          event.call_id ||
          `${event.tool_type || "tool"}:${event.name || "unnamed"}`,
        );
      }

      function renderFullPowerTool(event, completed) {
        const key = fullPowerToolKey(event);
        const tool = event.name || event.tool_type || "tool";
        let row = state.fullPowerToolRows.get(key);
        if (!row) {
          row = document.createElement("div");
          row.className = "bubble system tool-status";
          const indicator = document.createElement("span");
          indicator.className = "tool-status-indicator";
          const label = document.createElement("span");
          label.className = "tool-status-label";
          row.append(indicator, label);
          el.messages.appendChild(row);
          state.fullPowerToolRows.set(key, row);
        }
        row.classList.toggle("completed", completed);
        const label = row.querySelector(".tool-status-label");
        const result = event.result ?? event.output ?? event.status;
        label.textContent = completed
          ? `${tool} completed${result === undefined ? "" : `: ${shorten(JSON.stringify(result), 500)}`}`
          : `${tool} running...`;
        scrollMessagesToBottom();
      }

      function formatArtifactBytes(value) {
        const bytes = Number(value);
        if (!Number.isFinite(bytes) || bytes < 0) return "size unavailable";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function renderArtifactCard(artifact) {
        if (!artifact?.artifact_id || !artifact.filename || !artifact.download_url) return;
        let downloadUrl;
        try {
          downloadUrl = new URL(artifact.download_url, `${apiBase()}/`);
          if (downloadUrl.origin !== new URL(apiBase()).origin) return;
        } catch (_) {
          return;
        }
        let card = state.artifactCards.get(artifact.artifact_id);
        if (!card) {
          card = document.createElement("div");
          card.className = "artifact-card";
          const title = document.createElement("div");
          title.className = "artifact-card-title";
          const meta = document.createElement("div");
          meta.className = "artifact-card-meta";
          const link = document.createElement("a");
          link.className = "artifact-download";
          link.textContent = "Download";
          link.rel = "noopener";
          card.append(title, meta, link);
          el.messages.appendChild(card);
          state.artifactCards.set(artifact.artifact_id, card);
        }
        card.querySelector(".artifact-card-title").textContent = artifact.filename;
        card.querySelector(".artifact-card-meta").textContent =
          `${String(artifact.format || "").toUpperCase()} · ${formatArtifactBytes(artifact.byte_size)} · SHA-256 ${String(artifact.sha256 || "").slice(0, 16)}...`;
        const link = card.querySelector(".artifact-download");
        link.href = downloadUrl.href;
        link.download = artifact.filename;
        let preview = card.querySelector(".artifact-image-preview");
        if (String(artifact.mime_type || "").startsWith("image/")) {
          if (!preview) {
            preview = document.createElement("img");
            preview.className = "artifact-image-preview";
            preview.loading = "lazy";
            card.prepend(preview);
          }
          preview.alt = artifact.filename;
          preview.src = downloadUrl.href;
        } else {
          preview?.remove();
        }
        scrollMessagesToBottom();
      }

      function renderFullPowerEvent(event) {
        const validationIssue = validateFullPowerEvent(event);
        if (validationIssue) {
          appendBubble("system", `Invalid Full Power payload: ${validationIssue}.`);
          return;
        }
        if (event.type === "text.delta") {
          appendBubble("assistant", event.delta || "", true);
        } else if (event.type === "tool.call") {
          renderFullPowerTool(event, false);
        } else if (event.type === "tool.result") {
          renderFullPowerTool(event, true);
        } else if (event.type === "artifact.ready") {
          renderArtifactCard(event);
        } else if (event.type === "deliverable.incomplete") {
          appendBubble(
            "system",
            `Requested ${String(event.requested_format || "file").toUpperCase()} deliverable is incomplete.`,
          );
        } else if (event.type === "citation") {
          const citation = event.citation || {};
          appendBubble("system", `Citation: ${citation.title || citation.filename || "source"}${citation.url ? ` — ${citation.url}` : ""}`);
        } else if (event.type === "source") {
          const source = event.source || {};
          appendBubble("system", `Source: ${source.filename || source.query || source.url || source.type || "retrieved evidence"}${source.text ? `\n${shorten(source.text, 500)}` : ""}`);
        } else if (event.type === "prompt.perfected") {
          appendBubble(
            "system",
            event.changed
              ? "Prompt refined for Full Power while preserving the original chat message."
              : "Prompt was already clear; original wording was retained.",
          );
        } else if (event.type === "approval.required") {
          renderFullPowerApproval(event);
        } else if (event.type === "approval.executing") {
          const approval = state.pendingApprovals[event.approval_id];
          if (approval) approval.decision = event.approved;
          appendBubble(
            "system",
            `${event.name || "Tool"} ${event.approved ? "approved" : "rejected"}; saving continuation state.`,
          );
        } else if (event.type === "approval.resolved") {
          delete state.pendingApprovals[event.approval_id];
          appendBubble(
            "system",
            `${event.name || "Tool"} ${event.approved ? "approved" : "rejected"} by owner.`,
          );
        } else if (event.type === "completion") {
          if (!state.activeAssistantBubble && event.text) {
            appendBubble("assistant", event.text);
          }
          if (event.structured_output) {
            appendBubble("system", `Structured output:\n${JSON.stringify(event.structured_output, null, 2)}`);
          }
          for (const artifact of event.artifacts || []) {
            renderArtifactCard(artifact);
          }
          finalizeAssistantBubble();
        } else if (event.type === "error") {
          const detail = event.error?.detail ? `: ${event.error.detail}` : "";
          appendBubble("system", `Full Power error: ${event.error?.message || "Unknown error"}${detail}`);
        }
      }

      async function consumeFullPowerStream(response) {
        assertProtocolResponse(response);
        if (!response.ok) {
          const raw = await response.text();
          throw new Error(`Request failed (${response.status})${parseErrorBody(raw) ? `: ${parseErrorBody(raw)}` : ""}`);
        }
        if (!response.body) throw new Error("Streaming response body was unavailable.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const frames = buffer.split(/\r?\n\r?\n/);
          buffer = frames.pop() || "";
          for (const frame of frames) {
            const data = frame
              .split(/\r?\n/)
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).trimStart())
              .join("\n");
            if (!data) continue;
            try {
              renderFullPowerEvent(JSON.parse(data));
            } catch (_) {
              appendBubble("system", `Malformed stream event: ${shorten(data, 200)}`);
            }
          }
          if (done) break;
        }
      }

      async function streamFullPowerTurn(message, structuredOutput) {
        const controller = new AbortController();
        state.responsesAbortController = controller;
        const response = await fetch(
          `${apiBase()}/responses/sessions/${encodeURIComponent(state.fullPowerSessionId)}/turns`,
          {
            method: "POST",
            credentials: "include",
            signal: controller.signal,
            headers: requestHeaders(createRequestId(), "application/json"),
            body: JSON.stringify(protocolMessage({
              message,
              ...(structuredOutput ? { structured_output: structuredOutput } : {}),
            })),
          },
        );
        await consumeFullPowerStream(response);
      }

      async function perfectPrompt(prompt, surface) {
        const parsed = await fetchJson(`${apiBase()}/responses/prompt-perfect`, {
          method: "POST",
          credentials: "include",
          headers: requestHeaders(createRequestId(), "application/json"),
          body: JSON.stringify(protocolMessage({ prompt, surface })),
        });
        const refined = parsed.prompt?.refined_prompt;
        if (typeof refined !== "string" || !refined.trim()) {
          throw new Error("Prompt perfecting did not return refined text.");
        }
        return parsed.prompt;
      }

      async function resolveFullPowerApproval(approvalId, approve) {
        if (!state.fullPowerSessionId || state.fullPowerBusy) return;
        const controller = new AbortController();
        state.responsesAbortController = controller;
        state.fullPowerBusy = true;
        el.sendBtn.disabled = true;
        setStatus(approve ? "Approving tool..." : "Rejecting tool...", "live");
        try {
          const response = await fetch(
            `${apiBase()}/responses/sessions/${encodeURIComponent(state.fullPowerSessionId)}/approvals/${encodeURIComponent(approvalId)}`,
            {
              method: "POST",
              credentials: "include",
              signal: controller.signal,
              headers: requestHeaders(createRequestId(), "application/json"),
              body: JSON.stringify(protocolMessage({ approve })),
            },
          );
          await consumeFullPowerStream(response);
          setStatus("Full Power live", "live");
          await refreshFullPowerSessions();
        } catch (error) {
          if (error.name !== "AbortError") {
            appendBubble("system", `Approval request failed: ${shorten(String(error), 300)}`);
          }
          setStatus("Full Power live", "live");
        } finally {
          const approval = state.pendingApprovals[approvalId];
          if (approval) {
            approval.approveButton.disabled = approval.decision === false;
            approval.rejectButton.disabled = approval.decision === true;
          }
          state.fullPowerBusy = false;
          state.responsesAbortController = null;
          if (state.phase === PHASE.LIVE) el.sendBtn.disabled = false;
        }
      }

      async function sendFullPowerMessage() {
        const message = el.textInput.value.trim();
        if (!message || state.phase !== PHASE.LIVE || !state.fullPowerSessionId || state.fullPowerBusy) return;
        let structuredOutput;
        try {
          structuredOutput = structuredOutputRequest();
        } catch (error) {
          appendBubble("system", String(error));
          return;
        }
        appendBubble("user", message);
        el.textInput.value = "";
        finalizeAssistantBubble();
        state.fullPowerBusy = true;
        el.sendBtn.disabled = true;
        setStatus("PJ is working...", "live");
        try {
          await streamFullPowerTurn(message, structuredOutput);
          setStatus("Full Power live", "live");
          await refreshFullPowerSessions();
        } catch (error) {
          if (error.name !== "AbortError") {
            appendBubble("system", `Full Power request failed: ${shorten(String(error), 300)}`);
          }
          setStatus("Full Power live", "live");
        } finally {
          state.fullPowerBusy = false;
          state.responsesAbortController = null;
          if (state.phase === PHASE.LIVE) el.sendBtn.disabled = false;
        }
      }

      function startSelectedMode() {
        return state.mode === MODE.FULL_POWER ? startFullPowerSession() : startSession();
      }

      function stopSelectedMode() {
        return state.mode === MODE.FULL_POWER
          ? stopFullPowerSession({ announce: true })
          : stopSession({ announce: true });
      }

      function sendSelectedMessage() {
        return state.mode === MODE.FULL_POWER ? sendFullPowerMessage() : sendTextMessage();
      }

    function realtimeItemId(event, prefix) {
      return (
        event.item_id ||
        event.item?.id ||
        (
          event.response_id
            ? `${prefix}_${event.response_id}_${event.output_index || 0}`
            : null
        )
      );
    }

    function requireRealtimeItemId(event, prefix) {
      const externalId = realtimeItemId(event, prefix);
      if (externalId) return externalId;
      if (!state.missingRealtimeIds.has(event.type)) {
        state.missingRealtimeIds.add(event.type);
        appendBubble(
          "system",
          `Realtime event ${event.type || "unknown"} omitted its item identifier.`,
        );
      }
      return null;
    }

    async function handleCompletedAudioTranscript(event) {
      const externalId = requireRealtimeItemId(event, "input");
      if (!externalId) return;
      if (state.perfectedInputItems.has(externalId)) return;
      state.perfectedInputItems.add(externalId);
      const transcript = String(event.transcript || "").trim();
      if (!transcript) {
        state.perfectedInputItems.delete(externalId);
        appendBubble(
          "system",
          "Audio transcription was unavailable, so no response was requested.",
        );
        return;
      }
      upsertRealtimeBubble(
        externalId,
        "user",
        transcript,
        { status: "completed" },
      );
      let metadata = {};
      try {
        if (state.mode === MODE.FULL_POWER_VOICE) {
          setStatus("Refining transcript...", "live");
          const perfected = await perfectPrompt(
            transcript, "full_power_voice"
          );
          metadata = {
